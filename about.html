<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>About Shift Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: #141418;
      color: white;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
      padding: 28px 24px;
    }

    .app-icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 14px;
    }

    .app-name {
      font-size: 18px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      margin-bottom: 4px;
    }

    .app-version {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 20px;
      font-variant-numeric: tabular-nums;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin-bottom: 20px;
    }

    .copyright {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 16px;
      text-align: center;
    }

    .btn-github {
      display: inline-block;
      padding: 8px 18px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.65);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      margin-bottom: 24px;
    }

    .btn-github:hover  { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); }
    .btn-github:active { transform: scale(0.97); }

    .beta-section {
      width: 100%;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .toggle-row label {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #4ade80;
      cursor: pointer;
    }

    .beta-note {
      font-size: 11px;
      color: rgba(255,255,255,0.22);
      margin-top: 6px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="app-icon">⏱</div>
  <div class="app-name">Shift Tracker</div>
  <div class="app-version" id="app-version">v—</div>

  <div class="divider"></div>

  <div class="copyright">© 2026 Dustin Hoeppner</div>

  <button class="btn-github" id="github-link">View on GitHub</button>

  <div class="beta-section">
    <div class="toggle-row">
      <input type="checkbox" id="beta-checkbox">
      <label for="beta-checkbox">Receive beta updates</label>
    </div>
    <div class="beta-note">
      Beta builds may be unstable. Changes take effect on next update check.
      If you are already on a beta version, downgrading requires a new stable release.
    </div>
  </div>

  <script src="about-renderer.js"></script>
</body>
</html>
