name: Build Beta Release

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build-mac:
    name: Build Beta (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish macOS beta
        run: npm run build -- --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_RELEASE_TYPE: prerelease

  build-windows:
    name: Build Beta (Windows)
    runs-on: windows-latest
    needs: build-mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows beta
        run: npm run build -- --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_RELEASE_TYPE: prerelease
